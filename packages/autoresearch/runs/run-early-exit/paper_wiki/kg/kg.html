population.","isSurvey":false,"x":null,"y":null,"community":6,"betweenness":0}},{"id":"paper:p65","type":"Paper","label":"Investigating Gender Bias in BERT","properties":{"type":"Paper","label":"Investigating Gender Bias in BERT","id":"p65","stage":"survey","role":"method","year":"2020","venue":"arXiv preprint (workshop)","url":"https://arxiv.org/abs/2009.05021","arxivId":"","doi":"","clusterId":"C7","directionId":"","oneLiner":"Gender information is concentrated in particular BERT layers, and layer-wise probing localizes where stereotypes live.","keyFinding":"Gender bias is unevenly distributed across layers; a subset of layers is far more predictive of gender and stereotype associations, i.e., the bias 'matures' at specific depths.","weakness":"Encoder-only BERT, English, single demographic axis; probing is correlational and task-limited.","implication":"If gender is decodable mainly at specific layers, then the depth at which inference stops directly changes the amount of gender information available.","isSurvey":false,"x":null,"y":null,"community":6,"betweenness":0}},{"id":"paper:p66","type":"Paper","label":"Locating and Mitigating Gender Bias in Large Language Models","properties":{"type":"Paper","label":"Locating and Mitigating Gender Bias in Large Language Models","id":"p66","stage":"survey","role":"method","year":"2024","venue":"arXiv preprint","url":"https://arxiv.org/abs/2403.14409","arxivId":"","doi":"","clusterId":"C7","directionId":"","oneLiner":"Gender bias is localized to specific layers and components, so it can be targeted rather than treated uniformly.","keyFinding":"Gender bias concentrates in particular layers and modules (often MLPs and attention at certain depths); removing it there reduces bias with minimal general-performance loss.","weakness":"Bias measurement is attribute/task-dependent; mitigation heuristics may not generalize across all bias types.","implication":"The depth at which outputs are taken changes the effective bias level, so early-exit depth selection is a fairness lever.","isSurvey":false,"x":null,"y":null,"community":6,"betweenness":0}},{"id":"paper:p67","type":"Paper","label":"Projective Methods for Mitigating Gender Bias in Pre-trained Language Models","properties":{"type":"Paper","label":"Projective Methods for Mitigating Gender Bias in Pre-trained Language Models","id":"p67","stage":"survey","role":"method","year":"2024","venue":"arXiv preprint","url":"https://arxiv.org/abs/2403.18803","arxivId":"","doi":"","clusterId":"C7","directionId":"","oneLiner":"A gender subspace recurs across layers with varying strength, and projecting it out has layer-dependent effects.","keyFinding":"The feminine/masculine direction strength varies by layer (typically growing with depth), and projective debiasing behaves differently at different layers.","weakness":"Focus on the gender subspace in BERT-class encoder models; bias measured via a single-direction projection.","implication":"Since gender-direction strength is layer-dependent, exit depth directly affects how much gender information leaks into predictions.","isSurvey":false,"x":null,"y":null,"community":6,"betweenness":0}},{"id":"paper:p68","type":"Paper","label":"Gender Encoding Patterns in Pretrained Language Model Representations","properties":{"type":"Paper","label":"Gender Encoding Patterns in Pretrained Language Model Representations","id":"p68","stage":"survey","role":"method","year":"2025","venue":"arXiv preprint","url":"https://arxiv.org/abs/2503.06734","arxivId":"","doi":"","clusterId":"C7","directionId":"","oneLiner":"Gender information is encoded unevenly across layers and contexts, revealing where demographic signals live.","keyFinding":"The degree of gender encoding varies substantially across layers and depends on context, so no single layer is a uniform 'gender' source.","weakness":"Recent preprint with narrower gender scope and limited model coverage; probing-based (correlational).","implication":"Layer-dependent gender encoding means the information available at an early-exit depth differs across contexts and groups.","isSurvey":false,"x":null,"y":null,"community":6,"betweenness":0}},{"id":"paper:p69","type":"Paper","label":"Fine-Tuned Transformers Show Clusters of Similar Representations Across Layers","properties":{"type":"Paper","label":"Fine-Tuned Transformers Show Clusters of Similar Representations Across Layers","id":"p69","stage":"survey","role":"method","year":"2021","venue":"arXiv preprint (workshop)","url":"https://arxiv.org/abs/2109.08406","arxivId":"","doi":"","clusterId":"C7","directionId":"","oneLiner":"Transformer layers collapse into a few clusters of similar representations after fine-tuning, not a smooth gradient.","keyFinding":"Fine-tuned layers show block/clustered similarity structure (early, middle, late groups), so representation change is not monotonic and some layer groups are near-redundant.","weakness":"Focuses on representational similarity rather than task/attribute accuracy; encoder models only.","implication":"If layers form near-redundant clusters, exit-depth choice and per-group maturity differences depend on cluster boundaries.","isSurvey":false,"x":null,"y":null,"community":6,"betweenness":0}},{"id":"paper:p70","type":"Paper","label":"On the Effect of Dropping Layers of Pre-trained Transformer Models","properties":{"type":"Paper","label":"On the Effect of Dropping Layers of Pre-trained Transformer Models","id":"p70","stage":"survey","role":"method","year":"2022","venue":"Computer Speech & Language (arXiv 2020)","url":"https://arxiv.org/abs/2004.03844","arxivId":"","doi":"","clusterId":"C7","directionId":"","oneLiner":"Some transformer layers are nearly redundant or even harmful, so layer removal is surprisingly cheap.","keyFinding":"Many layers (including middle and some early ones) can be removed with minimal accuracy loss, revealing differential per-layer contribution.","weakness":"Layer removal is a crude proxy for early exit; not tested for subpopulation fairness; encoder-heavy.","implication":"Since layer importance varies, the depth at which inference stops does not preserve information equally across inputs.","isSurvey":false,"x":null,"y":null,"community":6,"betweenness":0}},{"id":"paper:p71","type":"Paper","label":"The Linear Representation Hypothesis and the Geometry of Large Language Models","properties":{"type":"Paper","label":"The Linear Representation Hypothesis and the Geometry of Large Language Models","id":"p71","stage":"survey","role":"method","year":"2023","venue":"arXiv preprint (ICML 2024)","url":"https://arxiv.org/abs/2311.03658","arxivId":"","doi":"","clusterId":"C7","directionId":"","oneLiner":"LLM features are stored as linear directions, giving a geometric basis for reading concepts from hidden states.","keyFinding":"Provides formal conditions and evidence that concepts are represented as approximately linear directions in activation space, supporting linear probing and steering.","weakness":"Theory-oriented with limited empirical breadth; no direct per-layer maturity or demographic subgroup analysis.","implication":"If concepts are linear directions, a linear probe at a layer measures how 'mature' a concept's direction is there.","isSurvey":false,"x":null,"y":null,"community":6,"betweenness":0}},{"id":"survey:S1","type":"Survey","label":"A Survey of Early Exit Deep Neural Networks in NLP","properties":{"type":"Survey","label":"A Survey of Early Exit Deep Neural Networks in NLP","id":"S1","stage":"survey","role":"survey","year":"2025","venue":"arXiv preprint","url":"https://arxiv.org/abs/2501.07670","arxivId":"","doi":"","clusterId":"","directionId":"","oneLiner":"Reviews early-exit methods for NLP models (encoder and decoder), including exit criteria (confidence, entropy, patience, hash), multi-exit architectures, training schemes (self-distillation, layer dropout), and efficiency/quality trade-offs, with a focus on NLP tasks and emerging LLM settings.","keyFinding":"Reviews early-exit methods for NLP models (encoder and decoder), including exit criteria (confidence, entropy, patience, hash), multi-exit architectures, training schemes (self-distillation, layer dropout), and efficiency/quality trade-offs, with a focus on NLP tasks and emerging LLM settings.","weakness":"","implication":"","isSurvey":true,"x":null,"y":null,"community":0,"betweenness":0}},{"id":"survey:S2","type":"Survey","label":"Adaptive Inference through Early-Exit Networks: Design, Challenges and Directions","properties":{"type":"Survey","label":"Adaptive Inference through Early-Exit Networks: Design, Challenges and Directions","id":"S2","stage":"survey","role":"survey","year":"2021","venue":"arXiv / ACM workshop","url":"https://arxiv.org/abs/2106.05022","arxivId":"","doi":"","clusterId":"","directionId":"","oneLiner":"Foundational survey of early-exit (adaptive inference) networks: where exits are placed, how the decision to exit is made, how accuracy and latency trade off, and the open design challenges and research directions.","keyFinding":"Foundational survey of early-exit (adaptive inference) networks: where exits are placed, how the decision to exit is made, how accuracy and latency trade off, and the open design challenges and research directions.","weakness":"","implication":"","isSurvey":true,"x":null,"y":null,"community":0,"betweenness":0}},{"id":"survey:S3","type":"Survey","label":"Split Computing and Early Exiting for Deep Learning Applications: Survey and Research Challenges","properties":{"type":"Survey","label":"Split Computing and Early Exiting for Deep Learning Applications: Survey and Research Challenges","id":"S3","stage":"survey","role":"survey","year":"2021","venue":"arXiv / ACM Computing Surveys","url":"https://arxiv.org/abs/2103.04505","arxivId":"","doi":"","clusterId":"","directionId":"","oneLiner":"Surveys split-computing (deploying neural networks across edge/cloud) and early-exit techniques together, covering when/where computation is offloaded or halted to reduce latency/resource use, and the open research challenges.","keyFinding":"Surveys split-computing (deploying neural networks across edge/cloud) and early-exit techniques together, covering when/where computation is offloaded or halted to reduce latency/resource use, and the open research challenges.","weakness":"","implication":"","isSurvey":true,"x":null,"y":null,"community":0,"betweenness":0}},{"id":"survey:S4","type":"Survey","label":"Taming the Titans: A Survey of Efficient LLM Inference Serving","properties":{"type":"Survey","label":"Taming the Titans: A Survey of Efficient LLM Inference Serving","id":"S4","stage":"survey","role":"survey","year":"2025","venue":"INLG 2025 (ACL)","url":"https://aclanthology.org/2025.inlg-main.32/","arxivId":"","doi":"","clusterId":"","directionId":"","oneLiner":"Survey of efficient LLM inference serving, covering model-level optimizations (speculative decoding, quantization, pruning, dynamic depth) and system-level techniques (batching, KV-cache management, scheduling) for throughput/latency/cost.","keyFinding":"Survey of efficient LLM inference serving, covering model-level optimizations (speculative decoding, quantization, pruning, dynamic depth) and system-level techniques (batching, KV-cache management, scheduling) for throughput/latency/cost.","weakness":"","implication":"","isSurvey":true,"x":null,"y":null,"community":2,"betweenness":0}},{"id":"survey:S5","type":"Survey","label":"Towards Efficient Generative Large Language Model Serving: A Survey from Algorithms to Systems","properties":{"type":"Survey","label":"Towards Efficient Generative Large Language Model Serving: A Survey from Algorithms to Systems","id":"S5","stage":"survey","role":"survey","year":"2023","venue":"arXiv preprint","url":"https://arxiv.org/abs/2312.15234","arxivId":"","doi":"","clusterId":"","directionId":"","oneLiner":"Comprehensive survey of generative LLM serving covering both algorithmic acceleration (speculative decoding, quantization, pruning, distillation) and systems (scheduling, batching, caching), and how they combine to reduce end-to-end inference cost.","keyFinding":"Comprehensive survey of generative LLM serving covering both algorithmic acceleration (speculative decoding, quantization, pruning, distillation) and systems (scheduling, batching, caching), and how they combine to reduce end-to-end inference cost.","weakness":"","implication":"","isSurvey":true,"x":null,"y":null,"community":2,"betweenness":0}},{"id":"survey:S6","type":"Survey","label":"Speculative Decoding and Beyond: An In-Depth Survey of Techniques","properties":{"type":"Survey","label":"Speculative Decoding and Beyond: An In-Depth Survey of Techniques","id":"S6","stage":"survey","role":"survey","year":"2025","venue":"arXiv preprint","url":"https://arxiv.org/abs/2502.19732","arxivId":"","doi":"","clusterId":"","directionId":"","oneLiner":"Deep survey of speculative decoding techniques (external draft models, self-speculative decoding, multi-token prediction, acceptance sampling) that accelerate LLM decoding while preserving output quality / distribution.","keyFinding":"Deep survey of speculative decoding techniques (external draft models, self-speculative decoding, multi-token prediction, acceptance sampling) that accelerate LLM decoding while preserving output quality / distribution.","weakness":"","implication":"","isSurvey":true,"x":null,"y":null,"community":1,"betweenness":0}},{"id":"survey:S7","type":"Survey","label":"A Survey on Fairness in Large Language Models","properties":{"type":"Survey","label":"A Survey on Fairness in Large Language Models","id":"S7","stage":"survey","role":"survey","year":"2023","venue":"arXiv preprint","url":"https://arxiv.org/abs/2308.10149","arxivId":"","doi":"","clusterId":"","directionId":"","oneLiner":"Survey of fairness in LLMs: definitions, sources of bias in data/training/inference, evaluation methods and benchmarks, and mitigation approaches, with attention to generative and downstream ss definitions, bias sources, evaluation methods, and mitigation approaches across the LLM life cycle (data, pre-training, fine-tuning, inference).","weakness":"","implication":"","isSurvey":true,"x":null,"y":null,"community":3,"betweenness":0}},{"id":"survey:S10","type":"Survey","label":"A Survey on Bias and Fairness in Machine Learning","properties":{"type":"Survey","label":"A Survey on Bias and Fairness in Machine Learning","id":"S10","stage":"survey","role":"survey","year":"2019","venue":"ACM Computing Surveys","url":"https://arxiv.org/abs/1908.09635","arxivId":"","doi":"","clusterId":"","directionId":"","oneLiner":"Foundational survey of bias and fairness in machine learning: definitions, taxonomies of bias (in data, algorithm, user-interaction), fairness notions and metrics (parity, equalized odds, counterfactual), and mitigation (pre-, in-, post-processing).","keyFinding":"Foundational survey of bias and fairness in machine learning: definitions, taxonomies of bias (in data, algorithm, user-interaction), fairness notions and metrics (parity, equalized odds, counterfactual), and mitigation (pre-, in-, post-processing).","weakness":"","implication":"","isSurvey":true,"x":null,"y":null,"community":3,"betweenness":0}},{"id":"survey:S11","type":"Survey","label":"Calibration in Deep Learning: A Survey of the State-of-the-Art","properties":{"type":"Survey","label":"Calibration in Deep Learning: A Survey of the State-of-the-Art","id":"S11","stage":"survey","role":"survey","year":"2023","venue":"arXiv preprint","url":"https://arxiv.org/abs/2308.01222","arxivId":"","doi":"","clusterId":"","directionId":"","oneLiner":"Survey of confidence calibration in deep learning: definitions of calibration (ECE, Brier), causes of miscalibration, post-hoc methods (temperature scaling, Platt, binning), and training-based calibration, with discussion of LLM frontiers.","keyFinding":"Survey of confidence calibration in deep learning: definitions of calibration (ECE, Brier), causes of miscalibration, post-hoc methods (temperature scaling, Platt, binning), and training-based calibration, with discussion of LLM frontiers.","weakness":"","implication":"","isSurvey":true,"x":null,"y":null,"community":5,"betweenness":0}},{"id":"paper:d1_01","type":"Paper","label":"Improving Group Fairness in Knowledge Distillation via Laplace Approximation of Early Exits","properties":{"type":"Paper","label":"Improving Group Fairness in Knowledge Distillation via Laplace Approximation of Early Exits","id":"d1_01","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.LG/cs.AI)","url":"https://arxiv.org/abs/2505.01070","arxivId":"","doi":"","clusterId":"","directionId":"d1","oneLiner":"Calibrated uncertainty extracted at early exits can be used to reweight training and improve group fairness in distillation.","keyFinding":"Laplace-based calibrated uncertainty at early exits more robustly identifies difficult/ambiguous instances than margin-based approaches, improving group fairness on MultiNLI.","weakness":"Small scale (BERT on one multi-label benchmark), evaluates group fairness only via reweighting-driven accuracy, and does not measure per-group exit-depth/accuracy-vs-depth distributions under a fixed threshold.","implication":"Suggests the exit-confidence signal is a legitimate fairness lever, motivating d1/d2: if calibration at exits is already used to improve fairness, a shared threshold may not exit at equal true-error across groups.","isSurvey":false,"x":null,"y":null,"community":14,"betweenness":0}},{"id":"paper:d1_02","type":"Paper","label":"Beyond Greedy Exits: Improved Early Exit Decisions for Risk Control and Reliability","properties":{"type":"Paper","label":"Beyond Greedy Exits: Improved Early Exit Decisions for Risk Control and Reliability","id":"d1_02","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.LG/cs.AI)","url":"https://arxiv.org/abs/2509.23666","arxivId":"","doi":"","clusterId":"","directionId":"d1","oneLiner":"A bandit-based adaptive exit threshold improves reliability and speedup but keeps risk marginal rather than group-wise.","keyFinding":"Adaptive, uncertainty-aware exit (UAT) yields 1.70-2.10x speedup with \u003c2% drop and stronger risk control than static-threshold greedy exits.","weakness":"Focuses on reliability/risk and efficiency, not demographic groups; no per-group fairness analysis; risk guarantees are marginal, not per-group (so a group-gap could persist by construction).","implication":"Exit decision is a dynamic per-instance function; if the confidence signal is group-correlated, the adaptive threshold inherits that — an open door for d1/d2.","isSurvey":false,"x":null,"y":null,"community":15,"betweenness":0}},{"id":"paper:d1_03","type":"Paper","label":"The Diminishing Returns of Early-Exit Decoding in Modern LLMs","properties":{"type":"Paper","label":"The Diminishing Returns of Early-Exit Decoding in Modern LLMs","id":"d1_03","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.CL/cs.AI)","url":"https://arxiv.org/abs/2603.23701","arxivId":"","doi":"","clusterId":"","directionId":"d1","oneLiner":"Modern LLMs show diminishing and architecture-dependent early-exit potential.","keyFinding":"Early-exit usefulness is shrinking in newer models and depends on architecture (dense > MoE/SSM), scale (>20B) and tuning (base > tuned).","weakness":"Efficiency/suitability only — no fairness dimension; no per-group exit-depth or accuracy-vs-depth curves; ignores demographic stratification.","implication":"Any d1 fairness result is conditional on the model's early-exit suitability; a fairness gap may be negligible simply because the model rarely exits early.","isSurvey":false,"x":null,"y":null,"community":16,"betweenness":0}},{"id":"paper:d1_04","type":"Paper","label":"SimLens for Early Exit in Large Language Models: Eliciting Accurate Latent Predictions with One More Token","properties":{"type":"Paper","label":"SimLens for Early Exit in Large Language Models: Eliciting Accurate Latent Predictions with One More Token","id":"d1_04","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.CL/cs.PF)","url":"https://arxiv.org/abs/2507.17618","arxivId":"","doi":"","clusterId":"","directionId":"d1","oneLiner":"A training-free decoder yields accurate intermediate-layer predictions and an entropy-based confidence signal for early exit.","keyFinding":"SimLens recovers accurate intermediate predictions and improves Iso-Compute accuracy; SimExit gives ~1.15-1.40x speedup at controlled accuracy.","weakness":"Single-token decision tasks only; no demographic/group analysis; no per-group exit-depth audit; assumes a single shared Iso-Compute benchmark.","implication":"The exit signal (entropy/confidence) is now well-defined and accurate enough for d1 to compute per-group accuracy-vs-depth curves on it.","isSurvey":false,"x":null,"y":null,"community":17,"betweenness":0}},{"id":"paper:d1_05","type":"Paper","label":"HALF: Harm-Aware LLM Fairness Evaluation Aligned with Deployment","properties":{"type":"Paper","label":"HALF: Harm-Aware LLM Fairness Evaluation Aligned with Deployment","id":"d1_05","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.CL/cs.AI)","url":"https://arxiv.org/abs/2510.12217","arxivId":"","doi":"","clusterId":"","directionId":"d1","oneLiner":"A deployment-aligned, harm-weighted framework shows LLM fairness is uneven across domains and not guaranteed by scale.","keyFinding":"Fairness is domain-contingent and not guaranteed by model size/performance; reasoning models vary by domain (good in medical, worse in education).","weakness":"No adaptive-inference/depth dimension; not about exit-depth or per-group compute; harm weighting is opinion-derived and domain-level not group-level.","implication":"For d1, per-group fairness of adaptive compute must be assessed within deployment context and by harm severity, not just aggregate metrics.","isSurvey":false,"x":null,"y":null,"community":18,"betweenness":0}},{"id":"paper:d2_01","type":"Paper","label":"Token-Level Entropy Reveals Demographic Disparities in Large Language Models","properties":{"type":"Paper","label":"Token-Level Entropy Reveals Demographic Disparities in Large Language Models","id":"d2_01","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.CL/cs.CV)","url":"https://arxiv.org/abs/2501.19337","arxivId":"","doi":"","clusterId":"","directionId":"d2","oneLiner":"LLM token-entropy is already differentiated by signaled race/gender, so a confidence-gated exit threshold may exit differently across groups.","keyFinding":"Black-associated names yield higher first-token entropy/diversity than White ones (uniformly signed across models), whereas explicit label probing is mostly null/reversed.","weakness":"Sentence-completion entropy only; not tied to any early-exit/adaptive-compute policy; small per-prompt effects; no calibration/ECE analysis; chat-format dependence complicates generalization.","implication":"If entropy gates early exit (CALM/PABEE-style), a single shared threshold will not yield equal exit-depth or equal true-error across groups — the d2 hypothesis.","isSurvey":false,"x":null,"y":null,"community":19,"betweenness":0}},{"id":"paper:d2_02","type":"Paper","label":"The Confidence Trap: Gender Bias and Predictive Certainty in LLMs","properties":{"type":"Paper","label":"The Confidence Trap: Gender Bias and Predictive Certainty in LLMs","id":"d2_02","stage":"latest","role":"B","year":"","venue":"AAAI 2026 (also arXiv preprint cs.CL/cs.LG)","url":"https://arxiv.org/abs/2601.07806","arxivId":"","doi":"","clusterId":"","directionId":"d2","oneLiner":"A fairness-aware calibration metric (Gender-ECE) reveals that model confidence is group-miscalibrated on gender bias.","keyFinding":"Models differ sharply in gender calibration; Gemma-2 is worst; raw confidence calibration does not reflect gender fairness.","weakness":"Gendered-pronoun resolution only (binary gender, a narrow task); six models; no mitigation/intervention; not tied to an adaptive-exit confidence policy.","implication":"Shared confidence thresholds are group-miscalibrated on a protected dimension, amplifying the risk that adaptive-exit decisions discriminate.","isSurvey":false,"x":null,"y":null,"community":20,"betweenness":0}},{"id":"paper:d2_03","type":"Paper","label":"Hierarchical Group-Conditional Conformal Risk Control for Selective Prediction in Language Models","properties":{"type":"Paper","label":"Hierarchical Group-Conditional Conformal Risk Control for Selective Prediction in Language Models","id":"d2_03","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.AI)","url":"https://arxiv.org/abs/2607.24562","arxivId":"","doi":"","clusterId":"","directionId":"d2","oneLiner":"Hierarchical group-conditional conformal risk control enforces per-group risk guarantees on selective prediction with abstention.","keyFinding":"HG-CRC reaches ~0% per-group violation (empirically) on ARC for well-calibrated models while standard CRC violates the budget in up to 47% of shifted trials.","weakness":"Marginal-guarantee-forcing (not fairness-in-parity); high participation/coverage cost (22-37 points); still benchmark-specific; abstraction can trigger heavy abstention; not demographic-labeled fairness per se.","implication":"Provides a concrete, testable mechanism for d2: group-conditional thresholding/calibration can flatten per-group error while preserving group safety.","isSurvey":false,"x":null,"y":null,"community":21,"betweenness":0}},{"id":"paper:d2_04","type":"Paper","label":"Fair and Calibrated Toxicity Detection with Robust Training and Abstention","properties":{"type":"Paper","label":"Fair and Calibrated Toxicity Detection with Robust Training and Abstention","id":"d2_04","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.LG)","url":"https://arxiv.org/abs/2605.14074","arxivId":"","doi":"","clusterId":"","directionId":"d2","oneLiner":"Calibration disparity is a hidden fairness violation, and confidence-based abstention can be unfair across groups.","keyFinding":"Aggregate calibration can look perfect (ECE 0.013) while all subgroups are miscalibrated; temperature scaling fails on non-uniform miscalibration; confidence abstention underperforms for identity-mentioning content.","weakness":"Toxicity classification (not generation); per-identity rather than broad demographic groups; abstention is a yes/no safety decision, not a depth decision; small-scale.","implication":"For d2, both per-group calibration AND the abstention/exit decision itself can carry group bias — a shared exit threshold is doubly at risk.","isSurvey":false,"x":null,"y":null,"community":22,"betweenness":0}},{"id":"paper:d2_05","type":"Paper","label":"Density Ridge Selective Prediction for LLM and VLM Hallucination Detection under Calibration Label Scarcity","properties":{"type":"Paper","label":"Density Ridge Selective Prediction for LLM and VLM Hallucination Detection under Calibration Label Scarcity","id":"d2_05","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.LG/cs.AI/cs.CV)","url":"https://arxiv.org/abs/2606.10198","arxivId":"","doi":"","clusterId":"","directionId":"d2","oneLiner":"A density-ridge confidence estimator is more accurate but still degrades under calibration-label scarcity.","keyFinding":"Density-ridge scoring beats Semantic Entropy/log-probability by 5-20 AUROC points and degrades more gracefully under label scarcity (n_cal=200).","weakness":"No fairness/group dimension; hallucination-detection framing; no per-group calibration or demographic analysis; geometric estimator is domain-specific.","implication":"Per-group calibration for small demographic groups will face label scarcity; this work shows which estimator degrades least and how much.","isSurvey":false,"x":null,"y":null,"community":23,"betweenness":0}},{"id":"paper:d3_04","type":"Paper","label":"Uncertainty Drives Social Bias Changes in Quantized Large Language Models","properties":{"type":"Paper","label":"Uncertainty Drives Social Bias Changes in Quantized Large Language Models","id":"d3_04","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.CL)","url":"https://arxiv.org/abs/2602.06181","arxivId":"","doi":"","clusterId":"","directionId":"d3","oneLiner":"Quantization flips biases unpredictably and asymmetrically across groups, driven by uncertainty, even when aggregate bias is unchanged.","keyFinding":"Up to 21% of responses flip bias state with no aggregate change; uncertainty makes flips 3-11x more likely; asymmetric group impacts (+18.6% worse / -14.1% better) cancel in aggregate.","weakness":"Quantization-specific (not pruning/early-exit); uncertainty link is correlational; group-specific shifts vary unpredictably across models, limiting portability of conclusions.","implication":"The uncertainty/confidence signal is the driver of compression-induced, group-asymmetric error — directly bridging d3 to d2 and to d1's entropy-gated exit.","isSurvey":false,"x":null,"y":null,"community":24,"betweenness":0}},{"id":"paper:d3_05","type":"Paper","label":"The Impact of Inference Acceleration on Bias of LLMs","properties":{"type":"Paper","label":"The Impact of Inference Acceleration on Bias of LLMs","id":"d3_05","stage":"latest","role":"B","year":"","venue":"arXiv preprint (cs.CL/cs.AI/cs.LG)","url":"https://arxiv.org/abs/2410.22118","arxivId":"","doi":"","clusterId":"","directionId":"d3","oneLiner":"Inference acceleration changes LLM bias in complex, model- and strategy-specific ways.","keyFinding":"Acceleration optimizations cause significant, unpredictable changes in demographic bias; effects vary by strategy-model-bias-type combination.","weakness":"Older (outside strict window); observable-level and unpredictable; no mechanistic explanation; no per-group exit-depth or depth-budget analysis; acceleration strategies treated at a high level.","implication":"Adopting acceleration (including adaptive-depth) without per-group re-audit risks silent bias shifts — the practical motivation for d3 and d1.","isSurvey":false,"x":null,"y":null,"community":25,"betweenness":0}},{"id":"problem:p001","type":"OpenProblem","label":"Do different demographic groups exit at systematically different depths (exit-distribution disparity)?","properties":{"type":"OpenProblem","label":"Do different demographic groups exit at systematically different depths (exit-distribution disparity)?","clusterId":"C1","question":"Do different demographic groups exit at systematically different depths (exit-distribution disparity)?","x":null,"y":null,"community":0,"betweenness":0}},{"id":"problem:p002","type":"OpenProblem","label":"Is the confidence/entropy that drives exit equally reliable across groups? (calibration disparity)","properties":{"type":"OpenProblem","label":"Is the confidence/entropy that drives exit equally reliable across groups? (calibration disparity)","clusterId":"C1","question":"Is the confidence/entropy that drives exit equally reliable across groups? (calibration disparity)","x":null,"y":null,"community":0,"betweenness":0}},{"id":"problem:p003","type":"OpenProblem","label":"Are accuracy-vs-depth curves different across groups, so a fixed threshold yields unequal quality? (layer-wise capability disparity)","properties":{"type":"OpenProblem","label":"Are accuracy-vs-depth curves different across groups, so a fixed threshold yields unequal quality? (layer-wise capability disparity)","clusterId":"C1","question":"Are accuracy-vs-depth curves different across groups, so a fixed threshold yields unequal quality? (layer-wise capability disparity)","x":null,"y":null,"community":0,"betweenness":0}},{"id":"problem:p004","type":"OpenProblem","label":"Can a learned exit router be trained to be group-fair?","properties":{"type":"OpenProblem","label":"Can a learned exit router be trained to be group-fair?","clusterId":"C1","question":"Can a learned exit router be trained to be group-fair?","x":null,"y":null,"community":0,"betwe
