<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" stroke="none"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#ffffff"/>

  <!-- Group: Environment -->
  <rect x="30" y="30" width="560" height="420" rx="8" ry="8" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="42" y="52" font-size="12" fill="#6b7280" font-weight="bold">Environment</text>

  <!-- Group: Metrics -->
  <rect x="640" y="30" width="230" height="420" rx="8" ry="8" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="652" y="52" font-size="12" fill="#6b7280" font-weight="bold">Metrics</text>

  <!-- Node: Single-Turn Benchmarks -->
  <rect x="70" y="90" width="180" height="60" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="160" y="116" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">Single-Turn</text>
  <text x="160" y="134" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">Benchmarks</text>

  <!-- Node: Sharding -->
  <rect x="70" y="220" width="180" height="60" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="160" y="246" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">Sharding</text>
  <text x="160" y="264" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">(scissors)</text>
  <text x="160" y="292" font-size="10" fill="#6b7280" text-anchor="middle">at most one requirement per turn</text>

  <!-- Node: Conversation Simulator -->
  <rect x="310" y="220" width="200" height="60" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="410" y="246" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">Conversation</text>
  <text x="410" y="264" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">Simulator</text>

  <!-- Node: User Model -->
  <rect x="310" y="90" width="200" height="60" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="410" y="116" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">User Model</text>
  <text x="410" y="134" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">(person)</text>

  <!-- Node: LLM Under Test -->
  <rect x="310" y="370" width="200" height="60" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="410" y="396" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">LLM Under Test</text>
  <text x="410" y="414" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">(llm)</text>

  <!-- Node: Aptitude Metric -->
  <rect x="670" y="120" width="170" height="60" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="755" y="146" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">Aptitude Metric</text>
  <text x="755" y="164" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">(chart)</text>

  <!-- Node: Reliability Metric -->
  <rect x="670" y="250" width="170" height="60" rx="6" ry="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="755" y="276" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">Reliability Metric</text>
  <text x="755" y="294" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">(chart)</text>

  <!-- Edge: Single-Turn Benchmarks -> Sharding -->
  <path d="M 160 150 L 160 220" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Edge: Sharding -> Conversation Simulator -->
  <path d="M 250 250 L 310 250" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Edge: User Model -> Conversation Simulator -->
  <path d="M 410 150 L 410 220" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Edge: Conversation Simulator -> LLM Under Test -->
  <path d="M 410 280 L 410 370" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Edge: LLM Under Test -> Conversation Simulator (cyclic, offset) -->
  <path d="M 510 400 L 560 400 L 560 250 L 510 250" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Edge: Conversation Simulator -> Aptitude Metric -->
  <path d="M 510 235 L 610 235 L 610 150 L 670 150" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Edge: Conversation Simulator -> Reliability Metric -->
  <path d="M 510 265 L 610 265 L 610 280 L 670 280" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
</svg>